<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Girls Hostels — Student Shelter</title>
  <meta name="description" content="Find safe, verified, and comfortable girls hostels near your university.">
  
  <script>
    (function () {
      if (localStorage.getItem("studentShelterTheme") === "dark") {
        document.documentElement.setAttribute("data-bs-theme", "dark");
      }
    })();
  </script>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Shared CSS -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="girls">

  <!-- Header Placeholder (JS Load Karega) -->
  <div id="header-placeholder"></div>

  <main>
    <!-- 1. Page Header Banner -->
    <section class="page-banner-green text-center">
      <div class="container">
        <span class="section-highlight-pill bg-white mb-2">Verified Directory</span>
        <h1 class="display-5 fw-bold mb-2">Girls Hostels</h1>
        <p class="lead text-secondary mx-auto mb-0" style="max-width: 660px;">
          Safe, comfortable, and verified accommodation options for female students.
        </p>
      </div>
    </section>

    <!-- 2. Search & Filter Area + Results -->
    <section class="py-5">
      <div class="container">
        
        <!-- Filter Box -->
        <div class="card shadow-sm border-0 p-4 mb-4">
          <form id="filterForm" class="row g-3 align-items-end">
            <div class="col-md-4">
              <label for="cityFilter" class="form-label fw-semibold small mb-1">City</label>
              <select id="cityFilter" class="form-select">
                <option value="">Select City</option>
                <option value="Islamabad">Islamabad</option>
                <option value="Lahore">Lahore</option>
                <option value="Karachi">Karachi</option>
                <option value="Rawalpindi">Rawalpindi</option>
              </select>
            </div>

            <div class="col-md-4">
              <label for="budgetFilter" class="form-label fw-semibold small mb-1">Max Budget</label>
              <select id="budgetFilter" class="form-select">
                <option value="">Any Budget</option>
                <option value="15000">Under 15,000</option>
                <option value="20000">Under 20,000</option>
                <option value="25000">Under 25,000</option>
              </select>
            </div>

            <div class="col-md-4 d-grid">
              <button type="submit" class="btn btn-dark-green py-2">
                <i class="bi bi-search me-1"></i> Search Hostels
              </button>
            </div>
          </form>
        </div>

        <!-- Result Bar -->
        <div class="d-flex justify-content-between align-items-center mb-3">
          <p class="fw-semibold text-secondary mb-0" id="resultCount">Loading hostels...</p>
          <div class="d-flex gap-2">
            <select id="sortFilter" class="form-select form-select-sm" style="width: auto;">
              <option value="">Sort by Rent</option>
              <option value="low">Low to High</option>
              <option value="high">High to Low</option>
            </select>
            <button type="button" id="resetBtn" class="btn btn-outline-secondary btn-sm">Reset</button>
          </div>
        </div>

        <!-- Results Grid -->
        <div class="row g-4" id="results">
          <!-- Cards populated by JS -->
        </div>
        
      </div>
    </section>
  </main>

  <!-- Footer Placeholder (JS Load Karega) -->
  <div id="footer-placeholder"></div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  
  <!-- Main JS -->
  <script src="../js/main.js"></script>
  
  <!-- Listing JS -->
  <script src="../js/listing.js"></script>
</body>
</html>
