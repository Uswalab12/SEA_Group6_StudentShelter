<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Girls Hostels — Student Shelter</title>
    <script>
      (function () {
        if (localStorage.getItem("studentShelterTheme") === "dark") {
          document.documentElement.setAttribute("data-bs-theme", "dark");
        }
      })();
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/listing.css" />
  </head>
  <body data-page="girls">
    <div id="header-placeholder"></div>

    <main class="listing-main theme-pink">
      <div class="container">
        <section class="listing-panel">
          <div class="listing-head text-center">
            <span class="page-badge">PAGE 05</span>
            <h1>Girls Hostels</h1>
            <p>Safe and comfortable accommodation.</p>
          </div>

          <form class="filter-box" id="filterForm">
            <div class="filter-field">
              <i class="bi bi-geo-alt-fill" aria-hidden="true"></i>
              <select id="cityFilter" class="form-select" aria-label="Select City">
                <option value="">Select City</option>
              </select>
            </div>
            <div class="filter-field">
              <i class="bi bi-currency-rupee" aria-hidden="true"></i>
              <select id="budgetFilter" class="form-select" aria-label="Monthly Budget">
                <option value="">Monthly Budget</option>
              </select>
            </div>
            <button type="submit" class="btn-search">
              <i class="bi bi-search" aria-hidden="true"></i> Search
            </button>
          </form>

          <div class="result-bar">
            <span id="resultCount" role="status"></span>
            <div class="result-actions">
              <select id="sortFilter" class="form-select" aria-label="Sort by rent">
                <option value="">Sort by Rent</option>
                <option value="low">Low to High</option>
                <option value="high">High to Low</option>
              </select>
              <button type="button" id="resetBtn" class="btn-reset">Reset</button>
            </div>
          </div>

          <div id="results"></div>
        </section>
      </div>
    </main>

    <div id="footer-placeholder"></div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../js/layout.js"></script>
    <script src="../js/listing.js"></script>
  </body>
</html>
