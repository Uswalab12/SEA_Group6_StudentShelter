<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews &amp; Ratings — Student Shelter</title>
  <meta name="description" content="Read verified student reviews and ratings for hostels in Islamabad, Rawalpindi, and Lahore on Student Shelter.">
  
  <script>
    (function () {
      if (localStorage.getItem("studentShelterTheme") === "dark") {
        document.documentElement.setAttribute("data-bs-theme", "dark");
      }
    })();
  </script>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Shared & Page CSS -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/reviews.css">
</head>
<body>

  <!-- Header Placeholder (JS Load Karega) -->
  <div id="header-placeholder"></div>

  <main class="main-content">
    <!-- 1. Page Header (Light green background) -->
    <section class="page-banner-green text-center">
      <div class="container">
        <h1 class="display-5 fw-bold mb-2">Reviews and Ratings</h1>
      </div>
    </section>

    <section class="py-5">
      <div class="container">

        <!-- 2. Rating Summary -->
        <div class="row g-4 mb-4">
          <div class="col-md-4">
            <div class="card shadow-sm border-0 text-center h-100 p-4">
              <div class="display-4 fw-bold text-dark-green mb-2">
                <span id="average-rating">0.0</span> <span class="fs-4 text-muted">/ 5</span>
              </div>
              <div id="average-stars" class="text-warning fs-4 mb-2"></div>
              <p id="total-reviews" class="text-muted mb-0">0 reviews</p>
            </div>
          </div>
          <div class="col-md-8">
            <div class="card shadow-sm border-0 h-100 p-4" id="rating-bars">
              <!-- Dynamically populated by js/reviews.js -->
            </div>
          </div>
        </div>

        <!-- 3. Filter Bar -->
        <form id="filter-form" class="card shadow-sm border-0 p-4 mb-4">
          <div class="row g-3 align-items-end">
            <div class="col-md-4">
              <label for="filter-hostel" class="form-label fw-semibold">Hostel</label>
              <select id="filter-hostel" class="form-select">
                <option value="all">All Hostels</option>
              </select>
            </div>
            <div class="col-md-3">
              <label for="filter-rating" class="form-label fw-semibold">Rating</label>
              <select id="filter-rating" class="form-select">
                <option value="all">All Ratings</option>
                <option value="5">5 Stars</option>
                <option value="4">4 Stars</option>
                <option value="3">3 Stars</option>
                <option value="2">2 Stars</option>
                <option value="1">1 Star</option>
              </select>
            </div>
            <div class="col-md-3">
              <label for="sort-by" class="form-label fw-semibold">Sort by</label>
              <select id="sort-by" class="form-select">
                <option value="newest">Newest</option>
                <option value="highest">Highest rated</option>
                <option value="lowest">Lowest rated</option>
              </select>
            </div>
            <div class="col-md-2 d-grid">
              <button type="submit" id="search-btn" class="btn btn-dark-green">
                <i class="bi bi-search me-1"></i> Search
              </button>
            </div>
          </div>
        </form>

        <!-- 4. Review Cards Grid -->
        <div id="reviews-grid" class="row g-4" aria-live="polite">
          <!-- Dynamically populated by js/reviews.js -->
        </div>

        <!-- 5. Pagination / Load More -->
        <nav id="pagination" class="mt-4 d-flex justify-content-center" aria-label="Reviews pagination"></nav>
        <div id="load-more-wrap" class="mt-4 text-center d-md-none">
          <button type="button" id="load-more-btn" class="btn btn-outline-dark-green">Load more</button>
        </div>

        <!-- 6. Write a Review Form -->
        <section class="card shadow-sm border-0 mt-5 p-4 p-md-5" aria-labelledby="write-review-heading">
          <h2 id="write-review-heading" class="h3 fw-bold mb-4">Write a review</h2>

          <div id="form-success" class="alert alert-success d-none" role="status" aria-live="polite">
            <i class="bi bi-check-circle-fill me-2"></i> Thank you! Your review has been added and saved.
          </div>

          <form id="review-form" novalidate>
            <div class="row g-4">
              <!-- Left side fields -->
              <div class="col-lg-8">
                <div class="row g-3">
                  <div class="col-md-4">
                    <label for="reviewer-name" class="form-label fw-semibold">Name</label>
                    <input type="text" id="reviewer-name" name="name" class="form-control" placeholder="e.g. Ayesha Khan" required>
                    <div id="error-name" class="invalid-feedback"></div>
                  </div>
                  <div class="col-md-4">
                    <label for="review-hostel" class="form-label fw-semibold">Hostel</label>
                    <select id="review-hostel" name="hostel" class="form-select" required>
                      <option value="">Select a hostel</option>
                    </select>
                    <div id="error-hostel" class="invalid-feedback"></div>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">Stars</label>
                    <div id="star-rating-input" class="d-flex gap-1 fs-4 text-warning" role="radiogroup" aria-label="Star rating">
                      <!-- Stars populated by JS -->
                    </div>
                    <input type="hidden" id="review-rating" name="rating" value="0">
                    <div id="error-rating" class="text-danger small mt-1"></div>
                  </div>
                  
                  <div class="col-12">
                    <label for="review-comment" class="form-label fw-semibold">Comment</label>
                    <textarea id="review-comment" name="comment" class="form-control" rows="3" placeholder="Share your experience with rooms, Wi-Fi, mess, and location (minimum 10 characters)..." required></textarea>
                    <div id="error-comment" class="invalid-feedback"></div>
                  </div>
                </div>
              </div>

              <!-- Right side submit -->
              <div class="col-lg-4 d-flex align-items-end">
                <button type="submit" class="btn btn-dark-green w-100 py-3">Submit Review</button>
              </div>
            </div>
          </form>
        </section>

      </div>
    </section>
  </main>

  <!-- Footer Placeholder (JS Load Karega) -->
  <div id="footer-placeholder"></div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  
  <!-- Main & Page JS -->
  <script src="../js/main.js"></script>
  <script src="../js/reviews.js"></script>
</body>
</html>
