<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Your Hostel — Student Shelter</title>
    <script>
      (function () {
        if (localStorage.getItem("studentShelterTheme") === "dark") {
          document.documentElement.setAttribute("data-bs-theme", "dark");
        }
      })();
    </script>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Shared & Page CSS (Note: ../ is used since this file is in pages/ folder) -->
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/find-hostel.css" />
  </head>
  <body>
    
    <!-- Header Placeholder (Yahan JS se header load hoga) -->
    <div id="header-placeholder"></div>

    <main>
      <!-- 1. Page Header Banner -->
      <section class="page-banner-green text-center">
        <div class="container">
          <span class="section-highlight-pill bg-white mb-2">Verified Directory</span>
          <h1 class="display-5 fw-bold mb-2">Find Your Hostel</h1>
          <p class="lead text-secondary mx-auto mb-0" style="max-width: 660px;">
            Search verified boys and girls hostels by name and filter by city in real time.
          </p>
        </div>
      </section>

      <!-- 2. Search & Filter Area + 3. Results Grid -->
      <section class="py-5">
        <div class="container">
          <div class="filter-card mb-4">
            <div class="row g-3 align-items-end">
              <div class="col-md-7">
                <label for="searchInput" class="form-label fw-semibold small mb-1">
                  Search by Name
                </label>
                <div class="input-group">
                  <span class="input-group-text">
                    <i class="bi bi-search" aria-hidden="true"></i>
                  </span>
                  <input
                    type="search"
                    id="searchInput"
                    class="form-control"
                    placeholder="Type hostel name (e.g. Green Valley, Crescent)..."
                    aria-label="Search hostels by name"
                  />
                </div>
              </div>

              <div class="col-md-5">
                <label for="cityFilter" class="form-label fw-semibold small mb-1">
                  Filter by City
                </label>
                <select id="cityFilter" class="form-select" aria-label="Filter by City">
                  <option value="all">All Cities</option>
                </select>
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <p class="fw-semibold text-secondary mb-0" id="resultsCount">
              Loading hostels...
            </p>
          </div>

          <div class="row g-4" id="hostelsResultsGrid">
            <!-- Dynamically populated by ../js/find-hostel.js -->
          </div>
        </div>
      </section>
    </main>

    <!-- Footer Placeholder (Yahan JS se footer load hoga) -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap 5 JS Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../js/main.js"></script>
    <script src="../js/find-hostel.js"></script>
  </body>
</html>
