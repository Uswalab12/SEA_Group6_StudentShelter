<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locations — Student Shelter</title>
  <meta name="description" content="Find student hostels by city or area across Pakistan.">
  
  <script>
    (function () {
      if (localStorage.getItem("studentShelterTheme") === "dark") {
        document.documentElement.setAttribute("data-bs-theme", "dark");
      }
    })();
  </script>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Shared CSS -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Header Placeholder (JS Load Karega) -->
  <div id="header-placeholder"></div>

  <main>
    <!-- 1. Page Header Banner -->
    <section class="page-banner-green text-center">
      <div class="container">
        <span class="section-highlight-pill bg-white mb-2">Verified Accommodations</span>
        <h1 class="display-5 fw-bold mb-2">Find Hostels by Location</h1>
        <p class="lead text-secondary mx-auto mb-0" style="max-width: 660px;">
          Browse safe, affordable, and campus-friendly hostels across Pakistan's top university cities.
        </p>
      </div>
    </section>

    <!-- 2. Search Section -->
    <section class="py-5">
      <div class="container">
        
        <!-- Search Card -->
        <div class="card shadow-sm border-0 p-4 mb-4">
          <form id="search-form" class="row g-3 align-items-end">
            <div class="col-md-8">
              <label for="city-search" class="form-label fw-semibold small mb-1">Search by City or Student Area</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-search text-dark-green"></i></span>
                <input type="text" id="city-search" class="form-control" placeholder="e.g., Islamabad, H-12, Johar Town, Gulshan..." autocomplete="off">
              </div>
            </div>
            <div class="col-md-4 d-grid gap-2 d-md-flex justify-content-md-end">
              <button type="submit" class="btn btn-dark-green w-100 w-md-auto">Search</button>
              <button type="button" id="clear-filter-btn" class="btn btn-outline-secondary w-100 w-md-auto">Reset</button>
            </div>
          </form>
        </div>

        <!-- Results Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="d-flex align-items-center gap-2">
            <i class="bi bi-buildings text-dark-green fs-4"></i>
            <h2 class="h4 fw-bold mb-0">Available Cities</h2>
          </div>
          <p id="results-count" class="fw-semibold text-secondary mb-0" aria-live="polite">Loading locations...</p>
        </div>

        <!-- Results Grid -->
        <div class="row g-4" id="locations-grid">
          <!-- Cards Populated by JS -->
        </div>

        <!-- No Results State (Hidden by Default) -->
        <div id="no-results" class="text-center py-5 d-none" role="status">
          <div class="bg-light-green rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
            <i class="bi bi-geo-alt text-dark-green fs-1"></i>
          </div>
          <h3 class="h4 fw-bold">No results found</h3>
          <p class="text-muted mb-4">We couldn't find any city or area matching your search.</p>
          <button type="button" id="reset-search" class="btn btn-dark-green rounded-pill px-4">Show All Cities</button>
        </div>

      </div>
    </section>
  </main>

  <!-- Footer Placeholder (JS Load Karega) -->
  <div id="footer-placeholder"></div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  
  <!-- Main JS -->
  <script src="../js/main.js"></script>
  
  <!-- Page Specific JS -->
  <script src="../js/locations.js"></script>
</body>
</html>
